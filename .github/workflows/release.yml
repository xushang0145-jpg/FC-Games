name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download ROMs
        run: npm run download:roms
        env:
          ROM_BASE_URL: ${{ vars.ROM_BASE_URL }}

      - name: Build
        run: npm run build

      - name: Package dist
        run: |
          cd dist
          zip -r ../fc-games-collection-${{ github.ref_name }}.zip .
          cd ..
          tar -czf fc-games-collection-${{ github.ref_name }}.tar.gz -C dist .

      - name: Extract tag message
        id: tag
        run: |
          # 获取 tag 注释作为 release notes
          BODY=$(git tag -l --format='%(contents)' ${{ github.ref_name }})
          # 将消息写入文件，避免换行和特殊字符问题
          echo "$BODY" > /tmp/release-body.md
          echo "body_file=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md
          files: |
            fc-games-collection-${{ github.ref_name }}.zip
            fc-games-collection-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
