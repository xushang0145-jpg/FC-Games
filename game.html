<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC 游戏</title>
<link rel="stylesheet" href="/src/game/style.css">
<link rel="stylesheet" href="/src/game/virtual-gamepad.css">
</head>
<body>

<nav class="topbar">
  <button class="topbar__back" id="back-to-list">&#8592; 返回列表</button>
  <div class="topbar__spacer"></div>
  <span class="topbar__title" id="topbar-title"></span>
  <button class="topbar__keybind-btn" id="keybind-btn">&#127918; 按键设置</button>
  <button class="topbar__help-btn" id="help-btn">&#10067; 帮助</button>
</nav>

<div class="canvas-container" id="canvas-container">
  <canvas class="game-canvas" id="game-canvas" width="256" height="240"></canvas>
</div>

<div class="virtual-gamepad" id="virtual-gamepad" style="display:none;"></div>


<div class="error-overlay" id="error-panel">
  <div class="error-panel">
    <div class="error-panel__icon">&#9888;</div>
    <div class="error-panel__text" id="error-msg">游戏加载失败</div>
    <div class="error-panel__actions">
      <button class="btn--sm btn--save" id="retry-btn">重试</button>
      <button class="btn--sm btn--cancel" id="error-back-btn">返回列表</button>
    </div>
  </div>
</div>

<div class="unsupported-banner" id="unsupported-banner">
  您的浏览器不支持 Canvas 或 Web Audio API，无法运行游戏。请使用 Chrome、Firefox 或 Edge 的最新版本。
</div>

<div class="keybind-backdrop" id="keybind-backdrop"></div>
<div class="keybind-panel" id="keybind-panel">
  <div class="keybind-panel__header">
    <div class="keybind-panel__title">按键设置</div>
    <button class="keybind-panel__close" id="keybind-close">&#10005;</button>
  </div>
  <div class="keybind-panel__body" id="keybind-body"></div>
  <div class="conflict-tip" id="conflict-tip">&#9888; 该按键已被其他操作使用，请选择其他按键</div>
  <div class="keybind-panel__footer">
    <button class="btn--sm btn--cancel" id="keybind-cancel">取消</button>
    <button class="btn--sm btn--save" id="keybind-save">保存设置</button>
  </div>
</div>

<!-- 键位帮助浮层 -->
<div class="help-backdrop" id="help-backdrop"></div>
<div class="help-panel" id="help-panel">
  <div class="help-panel__header">
    <div class="help-panel__title">键位帮助</div>
    <button class="help-panel__close" id="help-close">&#10005;</button>
  </div>
  <div class="help-panel__body" id="help-body"></div>
  <div class="help-panel__footer">按 <kbd>H</kbd> 键快速打开 / 关闭帮助</div>
</div>

<script type="module" src="/src/game/main.js"></script>
</body>
</html>
