<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #0f0f1a;
    --card-bg: #1e1e30;
    --card-hover: #2a2a42;
    --accent: #e4000f;
    --accent-gold: #d4a017;
    --text: #e8e8f0;
    --text-dim: #8888a0;
    --border: #333355;
    --radius: 10px;
    --shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }

  /* ====== 顶栏 ====== */
  .header {
    background: linear-gradient(180deg, #1a1a35 0%, var(--bg) 100%);
    border-bottom: 2px solid var(--accent);
    padding: 16px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .header__logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header__icon {
    width: 40px;
    height: 40px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #fff;
    font-weight: bold;
  }

  .header__title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .header__title span { color: var(--accent); }

  .header__count {
    font-size: 13px;
    color: var(--text-dim);
    background: var(--card-bg);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  /* ====== 搜索区 ====== */
  .search-bar {
    max-width: 1200px;
    margin: 24px auto 0;
    padding: 0 40px;
  }

  .search-bar__input {
    width: 100%;
    max-width: 480px;
    padding: 12px 20px 12px 44px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-bar__input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(228, 0, 15, 0.15);
  }

  .search-bar__input::placeholder { color: var(--text-dim); }

  .search-bar__wrapper {
    position: relative;
    display: inline-block;
  }

  .search-bar__icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 16px;
    pointer-events: none;
  }

  /* ====== 网格容器 ====== */
  .main {
    max-width: 1320px;
    margin: 0 auto;
    padding: 28px 40px 60px;
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  /* ====== 游戏卡片 ====== */
  .game-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 12px 18px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }

  .game-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-gold));
    opacity: 0;
    transition: opacity 0.2s;
  }

  .game-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 8px 30px rgba(228, 0, 15, 0.2);
    background: var(--card-hover);
  }

  .game-card:hover::before { opacity: 1; }

  .game-card__icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 14px;
    background: linear-gradient(135deg, #2a2a50, #1a1a38);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    border: 1px solid var(--border);
  }

  .game-card__name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    letter-spacing: 0.5px;
  }

  .game-card__badge {
    display: inline-block;
    margin-top: 10px;
    padding: 3px 10px;
    font-size: 11px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
  }

  /* ====== 空状态 ====== */
  .empty-state {
    display: none;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  .empty-state__icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  .empty-state__text { font-size: 15px; }

  /* ====== 响应式 ====== */
  @media (max-width: 768px) {
    .header { padding: 14px 20px; }
    .search-bar { padding: 0 20px; }
    .main { padding: 20px; }
    .game-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .header__title { font-size: 18px; }
  }
</style>
</head>
<body>

<!-- ====== 顶栏 ====== -->
