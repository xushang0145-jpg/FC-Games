<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #0a0a14;
    --panel-bg: #1a1a30;
    --accent: #e4000f;
    --accent-gold: #d4a017;
    --text: #e8e8f0;
    --text-dim: #8888a0;
    --border: #2a2a48;
    --radius: 10px;
    --shadow: 0 8px 40px rgba(0,0,0,0.6);
    --green: #22c55e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ====== 顶栏 ====== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 48px;
    background: rgba(15, 15, 28, 0.95);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    z-index: 200;
    backdrop-filter: blur(10px);
  }

  .topbar__back {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: border-color 0.2s, background 0.2s;
  }

  .topbar__back:hover { border-color: var(--accent); background: rgba(255,255,255,0.05); }

  .topbar__title {
    margin-left: 16px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .topbar__title span { color: var(--accent); }

  .topbar__spacer { flex: 1; }

  .topbar__keybind-btn {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: border-color 0.2s, background 0.2s;
  }

  .topbar__keybind-btn:hover { border-color: var(--accent-gold); background: rgba(212, 160, 23, 0.1); }

  /* ====== Canvas 容器 ====== */
  .canvas-container {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at center, #111128 0%, #0a0a14 100%);
  }

  .canvas-frame {
    position: relative;
    width: 720px;
    height: 600px;
    background: #000;
    border: 3px solid #333;
    border-radius: 4px;
    box-shadow: 0 0 80px rgba(0,0,0,0.8), 0 0 200px rgba(228, 0, 15, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .canvas-placeholder {
    color: #222;
    font-size: 18px;
    text-align: center;
    user-select: none;
  }

  .canvas-placeholder__icon { font-size: 64px; margin-bottom: 12px; }
  .canvas-placeholder__text { font-size: 14px; }

  /* ====== 按键设置侧面板 ====== */
  .keybind-panel {
    position: fixed;
    top: 0; right: 0;
    width: 320px;
    height: 100vh;
    background: var(--panel-bg);
    border-left: 1px solid var(--border);
    z-index: 400;
    display: flex;
    flex-direction: column;
    box-shadow: -8px 0 40px rgba(0,0,0,0.5);
    transform: translateX(100%);
    transition: transform 0.25s ease;
  }

  .keybind-panel--open { transform: translateX(0); }

  .keybind-panel__header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .keybind-panel__title {
    font-size: 16px;
    font-weight: 600;
  }

  .keybind-panel__close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
  }

  .keybind-panel__close:hover { color: var(--text); }

  .keybind-panel__body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px;
  }

  .keybind-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .keybind-row__label {
    font-size: 14px;
    color: var(--text);
  }

  .keybind-row__key {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--accent-gold);
    cursor: pointer;
    min-width: 70px;
    text-align: center;
    transition: border-color 0.2s;
    font-family: monospace;
  }

  .keybind-row__key:hover { border-color: var(--accent-gold); }

  .keybind-row__key--listening {
    border-color: var(--accent);
    color: var(--accent);
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(228, 0, 15, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(228, 0, 15, 0); }
  }

  .keybind-panel__footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }

  .btn--sm {
    flex: 1;
    padding: 10px 16px;
    font-size: 13px;
    border-radius: 8px;
    font-weight: 500;
  }

  .btn--save {
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
  }

  .btn--cancel {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    cursor: pointer;
  }

  .btn--cancel:hover { border-color: var(--text-dim); }

  /* ====== 按键设置面板遮罩 ====== */
  .keybind-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 399;
    display: none;
  }

  .keybind-backdrop--visible { display: block; }

  /* ====== 冲突提示 ====== */
  .conflict-tip {
    color: var(--accent);
    font-size: 12px;
    margin-top: 6px;
    display: none;
  }

  .conflict-tip--visible { display: block; }

</style>
</head>
<body>

<!-- ====== 顶部栏 ====== -->
<nav class="topbar">
  <button class="topbar__back">← 返回列表</button>
  <div class="topbar__title">正在游玩：<span>超级玛莉</span></div>
  <div class="topbar__spacer"></div>
  <button class="topbar__keybind-btn">🎮 按键设置</button>
</nav>

<!-- ====== Canvas 画面区 ====== -->
<div class="canvas-container">
  <div class="canvas-frame">
    <div class="canvas-placeholder">
      <div class="canvas-placeholder__icon">🕹️</div>
      <div class="canvas-placeholder__text">NES 游戏画面</div>
      <div class="canvas-placeholder__text" style="margin-top:4px; color:#333;">256 × 240 → Canvas</div>
    </div>
  </div>
</div>

<!-- ====== 按键设置面板遮罩 ====== -->
<div class="keybind-backdrop" id="keybind-backdrop"></div>

<!-- ====== 按键设置侧面板 ====== -->
<div class="keybind-panel" id="keybind-panel">
  <div class="keybind-panel__header">
    <div class="keybind-panel__title">按键设置</div>
    <button class="keybind-panel__close">✕</button>
  </div>
  <div class="keybind-panel__body">
    <div class="keybind-row">
      <span class="keybind-row__label">↑ 上</span>
      <span class="keybind-row__key">ArrowUp</span>
    </div>
    <div class="keybind-row">
      <span class="keybind-row__label">↓ 下</span>
      <span class="keybind-row__key">ArrowDown</span>
    </div>
    <div class="keybind-row">
      <span class="keybind-row__label">← 左</span>
      <span class="keybind-row__key">ArrowLeft</span>
    </div>
    <div class="keybind-row">
      <span class="keybind-row__label">→ 右</span>
      <span class="keybind-row__key">ArrowRight</span>
    </div>
    <div class="keybind-row">
      <span class="keybind-row__label">🅰️ A 按钮</span>
      <span class="keybind-row__key">Z</span>
    </div>
    <div class="keybind-row">
      <span class="keybind-row__label">🅱️ B 按钮</span>
      <span class="keybind-row__key">X</span>
    </div>
    <div class="keybind-row">
      <span class="keybind-row__label">▶ Start</span>
      <span class="keybind-row__key">Enter</span>
    </div>
    <div class="keybind-row">
      <span class="keybind-row__label">🔘 Select</span>
      <span class="keybind-row__key">RightShift</span>
    </div>
    <div class="conflict-tip">⚠ 该按键已被"上"使用，请选择其他按键</div>
  </div>
  <div class="keybind-panel__footer">
    <button class="btn--sm btn--cancel">取消</button>
    <button class="btn--sm btn--save">保存设置</button>
  </div>
</div>

</body>
</html>
